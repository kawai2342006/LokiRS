name: Update data and deploy Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Download fresh market data before deployment
        type: boolean
        default: true
  schedule:
    # 22:17 UTC = 06:17 HKT next day. After the US close in both DST and standard time.
    # GitHub schedules run from the default branch and may be delayed.
    - cron: '17 22 * * 1-5'
    # Backup at 08:17 HKT after UTC-day markets close; GitHub cron is best-effort.
    - cron: '17 0 * * 2-6'

permissions:
  contents: read

concurrency:
  group: lokirs-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify calculations
        run: |
          python -m unittest discover -s tests -v
          node --test tests/*.test.js
          node --check assets/app.js
          node --check assets/home.js
          node --check assets/sentiment.js
      - name: Restore data download cache
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_data
        uses: actions/cache@v6
        with:
          path: .cache/openrs
          key: lokirs-data-v2-${{ github.run_id }}
          restore-keys: lokirs-data-v2-
      - name: Fetch free data and recalculate
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_data
        run: python -u scripts/update_data.py --refresh --workers 4
      - name: Build static files
        run: |
          touch .nojekyll
          python scripts/build.py
      - name: Retain the calculated snapshot
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/home.json data/sentiment.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public market snapshot"
            git push
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the static website
        id: deployment
        uses: actions/deploy-pages@v5
